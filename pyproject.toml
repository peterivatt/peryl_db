[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peryl_db"
version = "0.1.0"
description = "Peryl database models and migrations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "peryl_core",
    "SQLAlchemy>=2",
    "alembic",
    "psycopg[binary]>=3",
    "python-dotenv",
]

[tool.uv.sources]
peryl_core = { path = "../peryl_core", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["peryl_db", "peryl_db.*"]
